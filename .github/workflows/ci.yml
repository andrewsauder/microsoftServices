name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it. Runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This is a library, so it commits no composer.lock. Each run resolves the newest dependencies
# that composer.json allows on that PHP version, the same as an application that installs it.

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The lowest version composer.json allows. PHPStan analyses for the PHP it runs on,
          # so syntax newer than the floor fails here.
          php-version: '8.3'
          extensions: fileinfo, openssl
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer phpstan

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every PHP version composer.json allows, from the floor to the newest release
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, openssl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test

  # composer.json allows Guzzle 7 and Guzzle 8. The jobs above resolve Guzzle 8, so this job pins Guzzle 7
  # on the lowest PHP version.
  phpunit-guzzle-7:
    name: PHPUnit (PHP 8.3, Guzzle 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: fileinfo, openssl
          tools: composer:v2
          coverage: none
      - run: composer require "guzzlehttp/guzzle:^7.9" --no-update --no-interaction
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test
